<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISAT — Visor</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">ISAT</span>
    <nav class="tabs">
      <button class="tab active" data-tab="map">Mapa interactivo</button>
      <button class="tab" data-tab="explorer" disabled title="Próximamente">Explorador de datos</button>
    </nav>
    <div class="search" id="search">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <input
        type="search"
        id="search-input"
        placeholder="Buscar estudios: concesiones, volcanes…"
        autocomplete="off"
        spellcheck="false"
      />
      <ul class="search-results" id="search-results" hidden></ul>
    </div>
    <div class="topbar-right">
      <button id="projection-toggle" class="btn" title="Cambiar entre globo 3D y mapa 2D">
        Ver mapa 2D
      </button>
    </div>
  </header>

  <main id="map"></main>

  <!-- Selector de capas (arriba a la derecha) -->
  <div id="layer-switcher" class="layer-switcher">
    <button class="layer-switcher-toggle" title="Capas" aria-label="Capas" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <path d="M12 3 2 8.5 12 14l10-5.5L12 3z" />
        <path d="m2 12.5 10 5.5 10-5.5" />
        <path d="m2 16.5 10 5.5 10-5.5" />
      </svg>
    </button>
    <div class="layer-switcher-panel">
      <fieldset class="layer-group">
        <legend>Capa base</legend>
        <label><input type="radio" name="base-layer" value="osm" checked /> OpenStreetMap</label>
        <label><input type="radio" name="base-layer" value="satellite" /> Satélite</label>
        <label><input type="radio" name="base-layer" value="topo" /> Topográfico</label>
      </fieldset>
      <fieldset class="layer-group">
        <legend>Superposiciones</legend>
        <label>
          <input type="checkbox" id="overlay-concesiones" checked /> Concesiones de explotación
        </label>
        <label>
          <input type="checkbox" id="overlay-poi" checked /> Puntos de interés
        </label>
        <label class="overlay-pending" title="Disponible cuando se conecte el backend">
          <input type="checkbox" id="overlay-velocity" disabled /> Velocidad media de deformación
        </label>
      </fieldset>
    </div>
  </div>

  <!-- Botones flotantes (lado derecho) -->
  <div class="side-buttons">
    <button class="side-btn" id="btn-chart" title="Series temporales (próximamente)" aria-label="Series temporales">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v18h18" />
        <path d="m6 15 4-5 4 3 5-7" />
      </svg>
    </button>
    <button class="side-btn" id="btn-filters" title="Filtros (próximamente)" aria-label="Filtros">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16M7 12h10M10 17h4" />
      </svg>
    </button>
    <button class="side-btn" id="btn-refresh" title="Refrescar datos" aria-label="Refrescar datos">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
        <path d="M21 3v6h-6" />
      </svg>
    </button>
  </div>

  <!-- Leyendas (abajo a la izquierda) -->
  <div class="legends">
    <div class="legend">
      <div class="legend-title">Velocidad media [cm/año]</div>
      <div class="legend-ramp-row">
        <div class="legend-ramp" aria-hidden="true"></div>
        <div class="legend-ramp-labels">
          <span>2</span><span>1</span><span>0</span><span>-1</span><span>-2</span>
        </div>
      </div>
    </div>
    <div class="legend">
      <div class="legend-title">Tipo de terreno</div>
      <ul class="legend-items">
        <li><span class="legend-dot" style="--dot: #8e44ad"></span> Yacimiento petrolero</li>
        <li><span class="legend-dot" style="--dot: #d35400"></span> Deslizamiento</li>
        <li><span class="legend-dot" style="--dot: #2980b9"></span> Glaciar</li>
        <li><span class="legend-dot" style="--dot: #c0392b"></span> Volcán</li>
        <li><span class="legend-dot" style="--dot: #7f8c8d"></span> Otro</li>
      </ul>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
